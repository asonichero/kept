<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kept">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Kept</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#17121a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app — her note pinned on top, today's routine below, bottom tab bar. Dark-first. */
:root{
  --bg:#17121a; --surface:#221a26; --surface-2:#2c2231; --line:#3a2e40;
  --fg:#f2e9ee; --muted:#a8939f;
  --accent:#e2587c; --accent-ink:#1a0d13; --accent-soft:rgba(226,88,124,.14);
  --brass:#d1ad72; --brass-soft:rgba(209,173,114,.14);
  --good:#7fc59a; --warn:#e3b45c;
  --display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f5eef1; --surface:#ffffff; --surface-2:#f9f3f6; --line:#e6d9df;
  --fg:#2a1822; --muted:#7a6470;
  --accent:#a8274a; --accent-ink:#ffffff; --accent-soft:rgba(168,39,74,.09);
  --brass:#8a6526; --brass-soft:rgba(138,101,38,.10);
  --good:#2f7d50; --warn:#9a6a12; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#f5eef1; --surface:#ffffff; --surface-2:#f9f3f6; --line:#e6d9df;
  --fg:#2a1822; --muted:#7a6470;
  --accent:#a8274a; --accent-ink:#ffffff; --accent-soft:rgba(168,39,74,.09);
  --brass:#8a6526; --brass-soft:rgba(138,101,38,.10);
  --good:#2f7d50; --warn:#9a6a12; color-scheme:light }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);font-weight:500;text-wrap:balance;margin:0;letter-spacing:.005em}
h2{font-size:1.45rem}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.date{font-family:var(--display);font-size:1.05rem;font-style:italic;color:var(--muted)}
.standing{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--brass);font-weight:600;letter-spacing:.04em}
.standing .bar{width:70px;height:4px;border-radius:2px;background:var(--brass-soft);overflow:hidden}
.standing .bar i{display:block;height:100%;background:var(--brass)}

/* her note */
.note{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 20px 18px 20px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.seal{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%, color-mix(in srgb,var(--accent) 80%,#fff 20%), var(--accent) 55%, color-mix(in srgb,var(--accent) 70%,#000 30%));color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-size:1.6rem;font-weight:700;box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--accent) 70%,#000 30%), 0 2px 8px rgba(0,0,0,.25);flex-shrink:0}
.note .msg{font-family:var(--display);font-size:1.22rem;line-height:1.45;min-width:0}
.note .sig{margin-top:8px;font-family:var(--display);font-style:italic;color:var(--muted);font-size:.98rem}
.note .who{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:10px;font-size:.78rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.chip.hot{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.chip.brass{color:var(--brass);background:var(--brass-soft);border-color:transparent}

/* sections */
.section{display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}

/* check-in */
.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.choices.three{grid-template-columns:repeat(3,1fr)}
.choice{padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:.82rem;font-weight:600;color:var(--muted);text-align:center}
.choice[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);font-weight:600}
.btn.small{padding:7px 12px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* tasks */
.slot{display:flex;flex-direction:column}
.slot-label{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:4px 2px 6px}
.task{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left;width:100%;margin-bottom:6px}
.task .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;transition:all .15s}
.task.done .box{background:var(--accent);border-color:var(--accent)}
.task.done .box::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.task .t{min-width:0;font-weight:500}
.task .ess{display:block;font-size:.72rem;color:var(--accent);font-weight:600;letter-spacing:.04em}
.task .pts{font-size:.78rem;color:var(--brass);font-weight:700;font-variant-numeric:tabular-nums}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}

/* journal */
textarea,input[type=text],input[type=number],select{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:130px;resize:vertical;line-height:1.55}
.entry{border-left:2px solid var(--line);padding:2px 0 2px 14px;display:flex;flex-direction:column;gap:6px}
.entry .p{font-family:var(--display);font-style:italic;color:var(--muted)}
.entry .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.reply{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-family:var(--display);font-size:1.02rem}
.reply b{font-family:var(--body);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:2px}

/* rewards */
.reward{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.purse{display:flex;align-items:baseline;gap:8px}
.purse .n{font-family:var(--display);font-size:2.4rem;color:var(--brass);font-variant-numeric:tabular-nums;line-height:1}

/* settings */
label.f{display:flex;flex-direction:column;gap:6px;font-size:.85rem;font-weight:600}
label.f span.h{font-weight:400;color:var(--muted);font-size:.8rem}
.styles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.style-opt{text-align:left;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;gap:3px}
.style-opt b{font-family:var(--display);font-weight:500;font-size:1.05rem}
.style-opt small{color:var(--muted);font-size:.78rem;line-height:1.35}
.style-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
input[type=range]{width:100%;accent-color:var(--accent)}
.scale{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.edit-row{display:grid;grid-template-columns:1fr 92px 34px;gap:6px;align-items:center}
.edit-row input,.edit-row select{padding:8px 10px;font-size:.9rem}
.x{border:1px solid var(--line);background:transparent;border-radius:8px;height:36px;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--muted)}
input[type=time]{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-variant-numeric:tabular-nums}
input.time{width:auto;padding:5px 8px;font-size:.85rem}

/* burnout */
.burnout{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px dashed var(--line)}
.burnout.on{border-style:solid;border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:10px 0 12px;font-size:.72rem;font-weight:600;letter-spacing:.06em;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
nav.tabs button[aria-current="page"]{color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);opacity:0;background:var(--surface-2);border:1px solid var(--line);color:var(--fg);padding:10px 16px;border-radius:999px;font-size:.88rem;font-weight:600;transition:all .25s;pointer-events:none;z-index:30;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.banner .btn{white-space:nowrap}
.banner{flex-wrap:wrap}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--brass-soft);color:var(--fg);font-size:.88rem}
.empty{color:var(--muted);font-style:italic;font-family:var(--display);padding:6px 2px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{display:flex;flex-direction:column;gap:5px;align-items:center;font-size:.7rem;color:var(--muted);letter-spacing:.06em}
.week i{width:100%;aspect-ratio:1;max-width:36px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);display:block}
.week i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--surface-2))}
.week i.l2{background:color-mix(in srgb,var(--accent) 60%,var(--surface-2))}
.week i.l3{background:var(--accent);border-color:var(--accent)}
.week .today{color:var(--fg);font-weight:700}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.98);opacity:.6}100%{transform:none;opacity:1}}
</style>

</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
// ---------- storage ----------
const KEY = "kept.v1";
function load(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} queueSync(); }

const uid = () => Math.random().toString(36).slice(2,9);
const dk = (d=new Date()) => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pick = a => a[Math.floor(Math.random()*a.length)];

function defaults(){
  return {
    v:1, configured:false, dismissedIntro:false,
    me:{ name:"Ed", term:"boy" },
    her:{ name:"Madame Wren", style:"governess", intensity:3, pet:"pet" },
    tasks:[
      {id:uid(), title:"Take your meds", slot:"morning", essential:true, pts:10, at:"08:30"},
      {id:uid(), title:"Drink a full glass of water", slot:"morning", essential:true, pts:5},
      {id:uid(), title:"Get properly dressed", slot:"morning", essential:false, pts:5},
      {id:uid(), title:"Eat a real lunch", slot:"day", essential:true, pts:10},
      {id:uid(), title:"Ten minutes outside", slot:"day", essential:false, pts:5},
      {id:uid(), title:"One focused work block", slot:"day", essential:false, pts:10},
      {id:uid(), title:"Shower, or at least wash your face", slot:"evening", essential:false, pts:10},
      {id:uid(), title:"Tidy one surface", slot:"evening", essential:false, pts:5},
      {id:uid(), title:"Phone down before bed", slot:"evening", essential:false, pts:5}
    ],
    rewards:[
      {id:uid(), title:"An hour of guilt-free gaming", cost:40},
      {id:uid(), title:"Order the takeaway", cost:80},
      {id:uid(), title:"A whole lazy morning, permitted", cost:120}
    ],
    days:{}, journal:[], redeemed:[], points:0, devotion:0,
    ledger:{ linked:false },
    push:{ enabled:false, id:null },
    remind:{ checkin:"09:00", evening:"20:30" }
  };
}
let S = load() || defaults();
S.push = S.push || { enabled:false, id:null };
S.remind = S.remind || { checkin:"09:00", evening:"20:30" };

// ---------- reminders (push) ----------
const INSTALLED_BUILD = !!document.querySelector('link[rel="manifest"]');
const IS_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const STANDALONE = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
let pushMsg = "";
function pushSupport(){
  if(!INSTALLED_BUILD) return "preview";
  if(!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return IS_IOS && !STANDALONE ? "ios-install" : "unsupported";
  if(Notification.permission === "denied") return "denied";
  return "ok";
}
function b64ToBytes(s){ const p="=".repeat((4-s.length%4)%4), b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(b, c=>c.charCodeAt(0)); }
function syncPayload(){
  const d=day();
  const reminders=[];
  if(S.remind.checkin) reminders.push({id:"checkin", kind:"checkin", time:S.remind.checkin});
  if(S.remind.evening) reminders.push({id:"evening", kind:"evening", time:S.remind.evening});
  for(const t of S.tasks) if(t.at) reminders.push({id:"t-"+t.id, kind:"task", time:t.at, taskId:t.id, title:t.title, essential:!!t.essential});
  return { id:S.push.id, tz:Intl.DateTimeFormat().resolvedOptions().timeZone || "Europe/London",
    her:S.her, me:{term:S.me.term, name:S.me.name}, reminders,
    today:{ date:dk(), done:Object.keys(d.done), checkin:!!d.checkin, evening:!!d.evening, burnout:!!d.burnout } };
}
async function postJSON(path, body){
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw Object.assign(new Error(j.message||j.error||("HTTP "+r.status)), {status:r.status, body:j});
  return j;
}
let syncT;
function queueSync(){ if(!S.push.enabled || !INSTALLED_BUILD) return; clearTimeout(syncT); syncT=setTimeout(()=>postJSON("/api/sync", syncPayload()).catch(()=>{}), 1200); }
async function enablePush(){
  const sup = pushSupport();
  if(sup!=="ok"){ render(); return; }
  try{
    pushMsg = "Asking your phone for permission…"; render();
    const perm = await Notification.requestPermission();
    if(perm!=="granted"){ pushMsg = "Notifications weren't allowed. Allow them for Kept in your phone's settings, then try again."; render(); return; }
    const kr = await fetch("/api/key"); const kj = await kr.json().catch(()=>({}));
    if(!kr.ok) throw new Error(kj.error==="storage" ? "Reminder storage isn't connected to the Vercel project yet." : (kj.message||"The server didn't answer."));
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ToBytes(kj.publicKey) });
    S.push.id = S.push.id || (uid()+uid()+uid());
    await postJSON("/api/sync", {...syncPayload(), id:S.push.id, subscription:sub.toJSON()});
    S.push.enabled = true; pushMsg = ""; save(); setNote(fill(V[bucket()].reply.def)); render(); toast("Reminders on");
  }catch(e){ pushMsg = "Couldn't turn reminders on. "+(e.message||e); render(); }
}
async function disablePush(){
  try{ if(S.push.id) await postJSON("/api/sync", {id:S.push.id, enabled:false}); }catch(e){}
  try{ const reg=await navigator.serviceWorker.ready; const sub=await reg.pushManager.getSubscription(); if(sub) await sub.unsubscribe(); }catch(e){}
  S.push.enabled=false; pushMsg=""; save(); render(); toast("Reminders off");
}
async function testPush(){
  try{ await postJSON("/api/sync", syncPayload()); await postJSON("/api/test", {id:S.push.id}); toast("Sent. Check your notifications."); }
  catch(e){ toast(e.status===404 ? "She's lost your address. Turn reminders off and on again." : "Couldn't send: "+(e.message||e)); }
}
function day(k=dk()){ if(!S.days[k]) S.days[k] = { done:{}, checkin:null, evening:null, burnout:false }; return S.days[k]; }

// ---------- voice ----------
const STYLES = {
  governess:{ label:"Strict governess", desc:"Proper, exacting, quietly fond of you.",
    praise:["Good.","Very good.","That will do nicely.","Correct."],
    sign:["Now, carry on.","Mind me.","Posture, please.","As you were."] },
  nurturing:{ label:"Nurturing mommy", desc:"Warm and firm. Looks after you whether you like it or not.",
    praise:["That's my good {term}.","So proud of you, {pet}.","There we go, sweetheart.","Clever {term}."],
    sign:["Mommy's watching.","Come back to me later.","I've got you.","Be good for me."] },
  executive:{ label:"Cool executive", desc:"Brisk, clipped, runs you like a schedule.",
    praise:["Noted. Good.","Efficient.","Acceptable. Well done.","That's what I pay attention to."],
    sign:["Next item.","Report back.","I'll check in.","Don't waste my time."] },
  tease:{ label:"Playful tease", desc:"Smug, amused, and very hard to disappoint.",
    praise:["Look at you, obeying.","Oh, very good, {pet}.","Aren't you sweet when you listen.","Mm. Good {term}."],
    sign:["Don't make me come over there.","I'll be watching, {pet}.","Try to keep up.","Be good. Or don't, and see."] }
};

const V = {
gentle:{
  greetMorning:["Morning, {pet}. No rush. Let's get you started gently.","Good morning, {name}. Tell me how you are first, then we'll decide the day together."],
  greetDay:["How's the day treating you, {pet}? Let's see where we are.","Afternoon, {name}. Small steps. Show me what you've managed."],
  greetEvening:["Evening, {pet}. Let's wind you down.","It's getting late, {name}. Come here and let me see how today went."],
  checkinAsk:"How are you, really?",
  low:["Then today is a soft day. I've trimmed it down to what matters. Just those, and I'll be proud of you.","Thank you for telling me. We're doing the essentials only, and that's an order I mean kindly."],
  ok:["Alright. A steady day, then. One thing at a time.","Good enough is good enough. Let's begin with the first item."],
  good:["Lovely. Use it well, but don't burn through it all at once.","I'm glad. Let's put that energy somewhere useful."],
  done:["Thank you, {pet}.","That's one less thing. Well done.","See? You can."],
  essentials:["The essentials are done. Everything else is a bonus now.","You've covered the important things. Breathe."],
  all:["Everything. All of it. I'm so pleased with you.","You finished the lot, {pet}. Rest now. That's earned."],
  revAll:["You did everything I asked. Sleep well.","A full day. I'm proud of you."],
  revSome:["You did {n} of {t}. That still counts, and I noticed every one.","Not everything, and that's alright. Tomorrow we try again."],
  revNone:["Today was hard. You still came to me, and that matters. We start fresh tomorrow.","Nothing ticked off, and I'm not cross. Water and bed, please."],
  burnout:["Burnout day. I'm taking the list off you. Essentials, water, rest. That's all I want.","Low battery noted. You don't have to earn rest today."],

function bucket(){ if(day().burnout) return "gentle"; const i = S.her.intensity; return i<=2?"gentle":i===3?"firm":"strict"; }
function fill(s, extra={}){
  return s.replace(/\{pet\}/g, S.her.pet||"pet").replace(/\{name\}/g, S.me.name||"you").replace(/\{term\}/g, S.me.term||"pet")
          .replace(/\{n\}/g, extra.n ?? "").replace(/\{t\}/g, extra.t ?? "");
}
function say(key, extra){ const v = V[bucket()][key]; return fill(Array.isArray(v)?pick(v):v, extra); }
function praise(){ return fill(pick(STYLES[S.her.style].praise)); }
function sign(){ return fill(pick(STYLES[S.her.style].sign)); }
function initial(){ const n=(S.her.name||"K").replace(/^(madame|miss|mistress|mommy|mummy|lady|ms\.?|mrs\.?)\s+/i,""); return (n[0]||"K").toUpperCase(); }

// ---------- derived ----------
const LEVELS = [ [0,"New"],[60,"Noticed"],[180,"Kept"],[400,"Trusted"],[800,"Cherished"],[1500,"Hers"] ];
function standing(){
  let i=0; for(let j=0;j<LEVELS.length;j++) if(S.devotion>=LEVELS[j][0]) i=j;
  const cur=LEVELS[i], nxt=LEVELS[i+1];
  return { name:cur[1], next:nxt?nxt[1]:null, pct: nxt ? (S.devotion-cur[0])/(nxt[0]-cur[0]) : 1, toNext: nxt? nxt[0]-S.devotion : 0 };
}
function todaysTasks(){ const d=day(); return d.burnout ? S.tasks.filter(t=>t.essential) : S.tasks; }
function slotNow(){ const h=new Date().getHours(); return h<12?"morning":h<17?"day":"evening"; }

// ---------- her current note ----------
let note = null;
function setNote(text){ note = { text, sig: sign() }; }
function freshNote(){
  const d=day(), s=slotNow();
  if(d.burnout && !note) return setNote(say("burnout"));
  if(s==="evening" && d.evening) return setNote(d.evening.text);
  setNote(say(s==="morning"?"greetMorning":s==="day"?"greetDay":"greetEvening"));
}

  }

  // burnout toggle
  h += `<div class="burnout ${d.burnout?"on":""}"><div><b>${d.burnout?"Burnout day is on":"Running on empty?"}</b><div class="muted" style="font-size:.85rem">${d.burnout?"Only essentials today. She'll be gentle.":"She'll cut today to the essentials and soften her tone."}</div></div>
    <button class="btn ${d.burnout?"ghost":""} small" data-act="burnout">${d.burnout?"Turn off":"Ask for it"}</button></div>`;

  // tasks
  h += `<section class="section"><div class="section-head"><h2>Today's orders</h2><span class="muted" style="font-variant-numeric:tabular-nums">${doneN} / ${tasks.length}</span></div>
    <div class="progress" aria-hidden="true"><i style="width:${tasks.length?doneN/tasks.length*100:0}%"></i></div>`;
  for(const slot of ["morning","day","evening"]){
    const ts = tasks.filter(t=>t.slot===slot); if(!ts.length) continue;
    h += `<div class="slot"><div class="slot-label">${{morning:"Morning",day:"During the day",evening:"Evening"}[slot]}</div>` +
      ts.map(t=>`<button class="task ${d.done[t.id]?"done":""}" data-task="${t.id}" aria-pressed="${!!d.done[t.id]}"><span class="box" aria-hidden="true"></span><span class="t">${esc(t.title)}${t.essential?'<span class="ess">Essential</span>':""}</span><span class="pts">+${t.pts}</span></button>`).join("") + `</div>`;
  }
  if(!tasks.length) h += `<div class="empty">No orders yet. Add some under Routine.</div>`;
  h += `</section>`;

  // evening review
  if(slotNow()==="evening" || d.evening){
    h += `<section class="section"><div class="section-head"><h2>Evening report</h2></div><div class="panel stack">` +
      (d.evening ? `<div class="muted">Reported at ${new Date(d.evening.ts).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}. She's read it.</div><button class="btn ghost" data-act="go-journal">Write in your journal</button>`
                 : `<div class="muted">Close the day with her. She'll review what you did.</div><button class="btn" data-act="evening">Give my report</button>`) +
      `</div></section>`;
  }

  // week
  h += `<section class="section"><div class="section-head"><h2>This week</h2><span class="muted" style="font-size:.85rem">No streaks to break</span></div><div class="panel"><div class="week">`;
  const now=new Date();
  for(let i=6;i>=0;i--){ const x=new Date(now); x.setDate(now.getDate()-i); const k=dk(x), dd=S.days[k];
    let lvl=0; if(dd){ const n=Object.keys(dd.done).length; lvl = n===0?(dd.checkin?1:0): n<4?2:3; }
    h+=`<div class="${i===0?"today":""}"><i class="${lvl?"l"+lvl:""}" title="${k}"></i>${x.toLocaleDateString("en-GB",{weekday:"short"}).slice(0,2)}</div>`; }
  h += `</div></div></section>`;
  return h;
}

// ---------- toast ----------
let tt; function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("show"),2200); }

// ---------- actions ----------
function award(n){ S.points+=n; S.devotion+=n; }
function toggleTask(id){
  const d=day(), t=S.tasks.find(x=>x.id===id); if(!t) return;
  if(d.done[id]){ delete d.done[id]; S.points=Math.max(0,S.points-t.pts); S.devotion=Math.max(0,S.devotion-t.pts); save(); render(); return; }
  d.done[id]=Date.now(); award(t.pts);
  const ts=todaysTasks(), n=ts.filter(x=>d.done[x.id]).length, ess=ts.filter(x=>x.essential), essDone=ess.every(x=>d.done[x.id]);
  if(n===ts.length){ award(10); setNote(say("all")); toast("+"+(t.pts+10)+" devotion, list complete"); }
  else if(t.essential && essDone && ess.length>1 && !d.burnout){ setNote(praise()+" "+say("essentials")); toast("+"+t.pts+" devotion"); }
  else { setNote(praise()+" "+say("done")); toast("+"+t.pts+" devotion"); }
  save(); render();
}
function doCheckin(){
  const d=day(); d.checkin={ mood:ci.mood, energy:ci.energy, ts:Date.now() }; award(5);
  if(ci.mood<=2 || ci.energy===1){ d.burnout=true; setNote(say("low")); }
  else if(ci.mood>=4 && ci.energy>=2) setNote(say("good")); else setNote(say("ok"));
  ci={mood:0,energy:0}; save(); render(); toast("+5 devotion for checking in");
}
function doEvening(){
  const d=day(), ts=todaysTasks(), n=ts.filter(x=>d.done[x.id]).length;
  const text = n===ts.length ? say("revAll") : n===0 ? say("revNone") : say("revSome",{n, t:ts.length});
  d.evening={ ts:Date.now(), n, t:ts.length, text }; award(5); setNote(text); save(); render();
}
function replyFor(text){
  const t=text.toLowerCase(), r=V[bucket()].reply;
  const has = re => re.test(t);
  let k="def";
  if(has(/\b(useless|stupid|pathetic|worthless|failure|hate myself|i'm awful|im awful|lazy)\b/)) k="bad";
  else if(has(/\b(tired|exhausted|knackered|shattered|drained|no energy|burnt out|burned out|sleepy)\b/)) k="tired";
  else if(has(/\b(anxious|anxiety|worried|panic|stressed|overwhelm\w*|nervous|scared)\b/)) k="anxious";
  else if(has(/\b(sad|lonely|down|cry|cried|upset|miserable|grief)\b/)) k="sad";
  else if(has(/\b(proud|managed|did it|finished|achieved|good day|won|happy)\b/)) k="proud";
  return fill(r[k]);
}

document.addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.tab){ tab=b.dataset.tab; confirmReset=false; if(tab==="today") freshNoteIfIdle(); render(); window.scrollTo(0,0); return; }
  if(b.dataset.task) return toggleTask(b.dataset.task);
  if(b.dataset.mood){ ci.mood=+b.dataset.mood; return render(); }
  if(b.dataset.energy){ ci.energy=+b.dataset.energy; return render(); }
  if(b.dataset.style){ S.her.style=b.dataset.style; S.configured=true; setNote(praise()+" "+sign()); save(); render(); toast("Style set"); return; }
  if(b.dataset.del){ S.tasks=S.tasks.filter(t=>t.id!==b.dataset.del); save(); render(); return; }
  if(b.dataset.add){ const t={id:uid(), title:"New order", slot:b.dataset.add, essential:false, pts:5}; S.tasks.push(t); save(); render(); const el=document.getElementById("t-"+t.id); if(el){el.focus(); el.select();} return; }
  if(b.dataset.redeem){ const r=S.rewards.find(x=>x.id===b.dataset.redeem); if(!r) return;
    if(S.points>=r.cost){ S.points-=r.cost; S.redeemed.push({title:r.title, ts:Date.now()}); setNote(say("redeemOk")); save(); render(); toast("Granted: "+r.title); }
    else { setNote(say("redeemNo")); toast((r.cost-S.points)+" more devotion needed"); tab="today"; render(); }
    return; }
  switch(b.dataset.act){
    case "push-on": return enablePush();
    case "push-off": return disablePush();
    case "push-test": return testPush();
    case "checkin": return doCheckin();
    case "evening": return doEvening();
    case "burnout": { const d=day(); d.burnout=!d.burnout; setNote(d.burnout?say("burnout"):say("ok")); save(); render(); return; }
    case "go-her": tab="her"; render(); window.scrollTo(0,0); return;
    case "go-journal": tab="journal"; render(); window.scrollTo(0,0); return;
    case "dismiss-intro": S.dismissedIntro=true; save(); render(); return;
    case "new-prompt": { const cur=jPrompt; const ps=V[bucket()].prompts; let p; do{p=pick(ps);}while(ps.length>1&&p===cur); jPrompt=p; render(); return; }
    case "journal": { const ta=document.getElementById("jtext"); const text=(ta.value||"").trim(); if(!text){ toast("Write something first"); return; }
      const reply=replyFor(text); S.journal.push({id:uid(), ts:Date.now(), prompt:fill(jPrompt), text, reply}); award(5); jPrompt=null; setNote(reply); save(); render(); toast("+5 devotion"); return; }
    case "add-reward": { const t=document.getElementById("rtitle").value.trim(), c=Math.max(5,parseInt(document.getElementById("rcost").value,10)||50); if(!t){ toast("Name the privilege first"); return; }
      S.rewards.push({id:uid(), title:t, cost:c}); save(); render(); toast("Privilege added"); return; }
    case "preview": S.configured=true; setNote(say("greetMorning")+" "+praise()); save(); tab="today"; render(); window.scrollTo(0,0); return;
    case "export": { const data=JSON.stringify(S); const done=()=>toast("Copied to clipboard");
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(data).then(done,()=>fallbackCopy(data)); else fallbackCopy(data); return; }
    case "import-open": document.getElementById("importbox").hidden=false; return;
    case "import": { try{ const x=JSON.parse(document.getElementById("importtext").value); if(!x||!x.tasks||!x.her) throw 0; S=x; note=null; save(); render(); toast("Data loaded"); }catch(err){ toast("That isn't Kept data. Copy it again and paste the whole thing."); } return; }
    case "reset": if(!confirmReset){ confirmReset=true; render(); return; } S=defaults(); note=null; confirmReset=false; save(); tab="today"; render(); toast("Fresh start"); return;
  }
});
function fallbackCopy(data){ document.getElementById("importbox").hidden=false; const ta=document.getElementById("importtext"); ta.value=data; ta.select(); toast("Select all and copy this text"); }
let lastFresh=0; function freshNoteIfIdle(){ if(Date.now()-lastFresh>10*60*1000){ note=null; lastFresh=Date.now(); } }

document.addEventListener("change", e=>{
  const el=e.target;
  if(el.dataset.edit){ const t=S.tasks.find(x=>x.id===el.dataset.edit); if(!t) return;
    const f=el.dataset.field; t[f]= f==="essential"? el.checked : f==="pts"? +el.value : f==="at"? el.value : (el.value.trim()||t[f]); save(); return; }
  if(el.dataset.remind){ S.remind[el.dataset.remind]=el.value; save(); return; }
  if(el.dataset.her){ const f=el.dataset.her; S.her[f]= f==="intensity"? +el.value : (el.value.trim()||S.her[f]); S.configured=true; if(f==="intensity"){ setNote(praise()+" "+sign()); toast(["","Gentle","Soft","Firm","Strict","Severe"][S.her.intensity]); } save(); return; }
  if(el.dataset.me){ S.me[el.dataset.me]=el.value.trim()||S.me[el.dataset.me]; S.configured=true; save(); return; }
});

// PWA: only registers where service workers are allowed (the installed app), silent elsewhere
try{ if("serviceWorker" in navigator && location.protocol==="https:" && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}

lastFresh=Date.now(); render();
queueSync();
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible"){ queueSync(); if(tab==="today"){ freshNoteIfIdle(); render(); } } });
})();
</script>
